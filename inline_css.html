<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inline CSS Activity</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f7fb; margin: 0; padding: 24px;">
  <h1 style="color: #1e3a8a; text-align: center;">Welcome to My Inline CSS Page</h1>

  <p style="color: #1f2937; font-size: 18px; line-height: 1.6;">
    This paragraph is styled using an <strong>inline CSS</strong>
    <span style="color: #b91c1c; font-weight: bold;">style</span> attribute directly inside the tag.
  </p>

  <div style="background-color: #dbeafe; border-left: 4px solid #2563eb; padding: 14px; margin-top: 16px;">
    <p style="margin: 0; color: #0f172a;">
      Inline CSS applies styles to a single HTML element at a time.
    </p>
  </div>
</body>
</html>
